[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commodity-factors"
version = "0.1.0"
description = "Commodity futures factor models and forecasting tools"
requires-python = ">=3.11"
dependencies = [
    # Numerical computing and estimation
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",

    # Data access and storage
    "wrds>=3.1",
    "pyarrow>=14.0",

    # Configuration
    "pyyaml>=6.0",

    # Visualization
    "matplotlib>=3.7",
    "plotly>=5.18",
    "streamlit>=1.49",
]

[project.optional-dependencies]
live = [
    "databento==0.87.0",
    "vercel==0.11.6",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
    "ipykernel>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
